<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SXISSOR is an exclusive privacy-first dating and community app for women who date women.">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' mailto:; upgrade-insecure-requests">
  <title>SXISSOR | Private by design</title>
  <style>
    :root{
      --black:#050505;--ink:#090909;--panel:#101010;--line:rgba(255,255,255,.16);
      --white:#f7f5f1;--cream:#ded8cf;--muted:#918d87;--red:#c3091d;--red2:#ff263b;
      --max:1240px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{overflow-x:hidden;background:var(--black);color:var(--white);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    body.locked{overflow:hidden}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit}
    a,button{-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid var(--red2);outline-offset:5px}
    .wrap{width:min(calc(100% - 48px),var(--max));margin:auto}
    .brand{font-size:1.18rem;font-weight:900;letter-spacing:.25em;white-space:nowrap}.brand i{color:var(--red2);font-style:normal}
    .overline{display:flex;align-items:center;gap:13px;color:#d8c8c9;font-size:.62rem;font-weight:800;letter-spacing:.26em;text-transform:uppercase}
    .overline:before{content:"";width:38px;height:1px;background:var(--red2)}
    .button{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 23px;border:1px solid var(--white);background:var(--white);color:#080808;font-size:.67rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;transition:.3s ease}
    .button:hover{background:var(--red2);border-color:var(--red2);color:white;transform:translateY(-3px)}
    .button.dark{background:transparent;color:white;border-color:#696969}.button.dark:hover{border-color:var(--white);background:#ffffff0d}

    /* CINEMATIC ENTRANCE */
    #entrance{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#030303;transition:opacity .9s ease,visibility .9s ease}
    #entrance:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#8f001c4d,transparent 35%);animation:entranceGlow 3.4s ease both}
    #entrance.done{opacity:0;visibility:hidden;pointer-events:none}
    .entrance-inner{position:relative;z-index:2;text-align:center}
    .entrance-word{overflow:hidden}
    .entrance-word span{display:block;font-size:clamp(3.7rem,10vw,10rem);font-weight:900;line-height:.88;letter-spacing:-.075em;text-transform:uppercase;transform:translateY(115%);animation:wordUp .8s cubic-bezier(.2,.8,.2,1) forwards}
    .entrance-word.red span{color:var(--red2);animation-delay:.6s}
    .entrance-mark{margin-top:28px;opacity:0;font-size:.72rem;font-weight:800;letter-spacing:.42em;text-transform:uppercase;animation:fadeIn .7s 1.35s forwards}
    .entrance-rule{width:0;height:1px;margin:25px auto 0;background:var(--red2);animation:ruleGrow .8s 1.65s forwards}
    .skip{position:absolute;z-index:3;right:30px;bottom:25px;border:0;background:none;color:#777;font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
    @keyframes wordUp{to{transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}@keyframes ruleGrow{to{width:100%}}@keyframes entranceGlow{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

    /* TOP MENU */
    header{position:fixed;top:0;z-index:50;width:100%;border-bottom:1px solid #ffffff14;background:#050505d9;backdrop-filter:blur(18px)}
    nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:25px}
    .nav-links{display:flex;align-items:center;gap:30px}.nav-links a{position:relative;color:#c5c2bd;font-size:.61rem;font-weight:850;letter-spacing:.19em;text-transform:uppercase}
    .nav-links a:not(.nav-contact):after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:1px;background:var(--red2);transform:scaleX(0);transform-origin:right;transition:transform .3s ease}.nav-links a:hover:after{transform:scaleX(1);transform-origin:left}
    .nav-contact{padding:10px 15px;border:1px solid #555;color:white!important}
    .menu-button{display:none;width:42px;height:42px;border:1px solid #444;background:none;cursor:pointer}.menu-button span{display:block;width:17px;height:1px;margin:5px auto;background:white}
    .mobile-menu{position:fixed;inset:76px 0 auto;z-index:45;display:none;padding:28px 24px;border-bottom:1px solid var(--line);background:#070707}.mobile-menu.open{display:grid;gap:22px}.mobile-menu a{font-size:1.2rem;font-weight:800;letter-spacing:-.03em}

    /* HERO */
    .hero{position:relative;min-height:100vh;display:grid;align-items:center;padding:145px 0 80px;overflow:hidden}
    .hero:before{content:"";position:absolute;width:58vw;height:58vw;right:-15vw;top:2vh;border:1px solid #ffffff0e;border-radius:50%;box-shadow:0 0 0 90px #ffffff08,0 0 0 180px #ffffff05}
    .hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 73% 40%,#a2002042,transparent 30%);pointer-events:none}
    .hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.08fr .92fr;gap:75px;align-items:center}
    h1{margin:24px 0 22px;font-size:clamp(4.6rem,9vw,9rem);line-height:.82;letter-spacing:-.085em;text-transform:uppercase}
    h1 span{display:block;color:var(--red2)}
    .hero-copy{max-width:590px;color:var(--cream);font-size:1rem;letter-spacing:.01em}
    .actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:32px}
    .hero-meta{display:flex;flex-wrap:wrap;gap:20px;margin-top:35px;color:#8e8984;font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero-meta span{display:flex;align-items:center;gap:8px}.hero-meta span:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red2)}
    .phone-stage{position:relative;display:grid;place-items:center}.phone-ring{position:absolute;width:470px;height:470px;border:1px solid #ffffff1d;border-radius:50%;animation:ringBreath 5s ease-in-out infinite}.phone-ring:after{content:"";position:absolute;inset:45px;border:1px solid #c3091d55;border-radius:50%}
    .phone{position:relative;width:min(350px,90vw);padding:13px;border:1px solid #555;border-radius:46px;background:linear-gradient(145deg,#272727,#070707);box-shadow:0 45px 120px #000,0 0 80px #a0002040;animation:phoneFloat 4.5s ease-in-out infinite}
    .screen{min-height:650px;padding:20px 16px;border:1px solid #292929;border-radius:35px;background:#000}.phone-logo{text-align:center;font-size:.85rem;font-weight:950;letter-spacing:.2em}.phone-title{display:flex;justify-content:space-between;align-items:end;margin:25px 0 12px}.phone-title b{font-size:1rem}.phone-title small{color:#777;font-size:.55rem}
    .profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profile{position:relative;height:225px;display:flex;align-items:flex-end;padding:11px;border:1px solid #333;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 25%,#ffffff18,transparent 28%),linear-gradient(150deg,#6e1520,#160105 68%,#070707)}
    .profile:nth-child(2){background:radial-gradient(circle at 50% 25%,#ffffff14,transparent 28%),linear-gradient(150deg,#42102e,#130107 68%,#070707)}.profile:nth-child(3){background:linear-gradient(150deg,#7b2029,#160105 68%,#070707)}.profile:nth-child(4){background:linear-gradient(150deg,#4f112d,#130107 68%,#070707)}
    .online{position:absolute;right:10px;top:10px;width:9px;height:9px;border:2px solid black;border-radius:50%;background:#3de087;animation:onlinePulse 1.8s ease-in-out infinite}
    .profile b{display:block;font-size:.7rem}.profile small{color:#bbb;font-size:.51rem}.tag{display:inline-block;margin-top:5px;padding:2px 5px;border:1px solid #a92b39;border-radius:99px;color:#ffabb4;font-size:.4rem;font-weight:900;text-transform:uppercase}
    .phone-nav{display:flex;justify-content:space-around;margin-top:11px;padding:8px;border:1px solid #252525;border-radius:99px;color:#777;font-size:.48rem;font-weight:850;text-transform:uppercase}.phone-nav strong{padding:5px 9px;border-radius:99px;background:var(--red);color:white}
    @keyframes phoneFloat{50%{transform:translateY(-16px) rotate(.7deg)}}@keyframes ringBreath{50%{transform:scale(1.08);opacity:.55}}@keyframes onlinePulse{50%{box-shadow:0 0 0 8px #3de08700}}

    /* BRAND STRIP */
    .brand-strip{border-block:1px solid var(--line);background:#090909}.strip-grid{display:grid;grid-template-columns:repeat(4,1fr)}.strip-item{padding:28px 25px;border-right:1px solid var(--line)}.strip-item:last-child{border:0}.strip-item b{display:block;margin-bottom:6px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}.strip-item span{color:#817c77;font-size:.66rem}

    /* CONTENT */
    section{padding:115px 0}.section-head{max-width:760px;margin-bottom:50px}.section-head.center{text-align:center;margin-inline:auto}.section-head.center .overline{justify-content:center}
    .section-head h2{margin:16px 0;font-size:clamp(3rem,6vw,6rem);line-height:.88;letter-spacing:-.075em;text-transform:uppercase}.section-head p{color:var(--muted)}
    .experience{border-block:1px solid var(--line);background:#090909}.experience-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}.sticky{position:sticky;top:130px;align-self:start}
    .feature-list{border-top:1px solid var(--line)}.feature{display:grid;grid-template-columns:60px 1fr auto;gap:18px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);transition:.3s ease}.feature:hover{padding-left:13px}.feature-no{color:var(--red2);font-size:.59rem;font-weight:900;letter-spacing:.18em}.feature h3{font-size:1rem;letter-spacing:.01em}.feature p{color:#888;font-size:.72rem}.arrow{color:#777;font-size:1.2rem;transition:.3s}.feature:hover .arrow{color:var(--red2);transform:translateX(5px)}
    .editorial{display:grid;grid-template-columns:1fr 1fr;gap:18px}.editorial-card{min-height:480px;display:flex;flex-direction:column;justify-content:flex-end;padding:38px;border:1px solid var(--line);background:radial-gradient(circle at 70% 15%,#ad001f42,transparent 40%),#0b0b0b}.editorial-card:nth-child(2){background:radial-gradient(circle at 30% 20%,#ffffff14,transparent 38%),#0b0b0b}.editorial-card h3{max-width:430px;margin:15px 0;font-size:clamp(2.5rem,5vw,4.8rem);line-height:.9;letter-spacing:-.065em;text-transform:uppercase}.editorial-card p{max-width:450px;color:#999;font-size:.8rem}
    .community{position:relative;text-align:center;overflow:hidden}.community:before{content:"SXISSOR";position:absolute;left:50%;top:50%;z-index:-1;color:#ffffff05;font-size:20vw;font-weight:950;letter-spacing:-.09em;transform:translate(-50%,-50%);white-space:nowrap}.community-quote{max-width:1000px;margin:auto;font-size:clamp(3.7rem,8vw,8rem);font-weight:950;line-height:.82;letter-spacing:-.085em;text-transform:uppercase}.community-quote span{color:var(--red2);animation:redGlow 3s ease-in-out infinite}
    .cta{padding-top:0}.cta-box{position:relative;overflow:hidden;padding:80px 45px;border:1px solid #7d1b28;background:#160003}.cta-box:after{content:"";position:absolute;width:390px;height:390px;right:-150px;bottom:-270px;border:1px solid #ff263b66;border-radius:50%;box-shadow:0 0 0 70px #ff263b10,0 0 0 140px #ff263b08}.cta-box h2{position:relative;z-index:1;max-width:870px;margin:17px 0;font-size:clamp(3.5rem,7vw,7rem);line-height:.85;letter-spacing:-.08em;text-transform:uppercase}.cta-box p,.cta-box .actions,.cta-box .overline{position:relative;z-index:1}.cta-box p{max-width:580px;color:#c6afb2}
    footer{padding:34px 0;border-top:1px solid var(--line);color:#777;font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-links{display:flex;flex-wrap:wrap;gap:20px}

    /* SCROLL REVEALS */
    .reveal{opacity:0;transform:translateY(35px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}.reveal.visible{opacity:1;transform:none}
    @keyframes redGlow{50%{text-shadow:0 0 45px #ff263b70}}

    @media(max-width:950px){.nav-links{display:none}.menu-button{display:block}.hero-grid,.experience-grid,.editorial{grid-template-columns:1fr}.sticky{position:static}.phone-stage{margin-top:35px}.strip-grid{grid-template-columns:1fr 1fr}.strip-item:nth-child(2){border-right:0}.strip-item:nth-child(-n+2){border-bottom:1px solid var(--line)}}
    @media(max-width:620px){.wrap{width:min(calc(100% - 28px),var(--max))}.hero{padding-top:120px}.hero h1{font-size:clamp(4.1rem,20vw,6rem)}.actions .button{width:100%}.phone-ring{display:none}.phone{animation:none}.strip-grid{grid-template-columns:1fr}.strip-item{border-right:0;border-bottom:1px solid var(--line)}.feature{grid-template-columns:38px 1fr}.feature .arrow{display:none}.editorial-card{min-height:390px;padding:25px}.cta-box{padding:50px 24px}section{padding:82px 0}.footer-row{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}#entrance{display:none}body.locked{overflow:auto}}
  </style>
</head>
<body class="locked">
  <div id="entrance" aria-hidden="true">
    <div class="entrance-inner">
      <div class="entrance-word"><span>Clear</span></div>
